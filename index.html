<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anillos de Hábitos</title>
<meta name="theme-color" content="#0b0d12">
<script>try{var _s=JSON.parse(localStorage.getItem("habitos_v1"));document.documentElement.setAttribute("data-theme",(_s&&_s.s&&_s.s.theme)||"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hábitos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--acc:#6366f1;--ok:#16a34a;--bad:#dc2626;--star:#f59e0b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d12;--card:#151922;--ink:#f3f4f6;--mute:#9aa3b2;--line:#262c38;--acc:#818cf8;--ok:#4ade80;--bad:#f87171;--star:#fbbf24}}
:root[data-theme="dark"]{--bg:#0b0d12;--card:#151922;--ink:#f3f4f6;--mute:#9aa3b2;--line:#262c38;--acc:#818cf8;--ok:#4ade80;--bad:#f87171;--star:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:480px;margin:0 auto;min-height:100vh}
body.lock{overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:calc(env(safe-area-inset-top) + 14px) 16px 4px}
.top h1{font-size:22px;margin:0}
.top span{color:var(--mute);font-size:13px;text-transform:capitalize}
#view{padding:8px 16px 110px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:9px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;position:relative}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--acc);font-weight:600}
.nb{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;line-height:16px;padding:0 4px;font-weight:700}
.nb:empty{display:none}
.card{background:var(--card);border-radius:16px;padding:14px;margin:12px 0;border:1px solid var(--line)}
.card header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card header .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--acc)) 20%,transparent)}
.card h3{margin:0;font-size:16px;flex:1}
.badge{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--mute);white-space:nowrap}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
label.l,.lbl{display:block;font-size:12.5px;color:var(--mute);margin:2px 0 6px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
.row{display:flex;gap:8px;align-items:flex-start}
.row>*{flex:1}
.row>.chip{flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips.hs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.chips.hs .chip{white-space:nowrap;flex:0 0 auto}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 12px;border-radius:99px;font:inherit;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.big{width:100%;padding:12px;border-radius:12px}
.chip:disabled{opacity:.55}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin:6px 0}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:8px 0;border-radius:9px;font:inherit;font-size:14px}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.datenav{display:flex;align-items:center;gap:8px;margin:6px 0}
.datenav>button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px}
.datenav>button:disabled{opacity:.3}
.datenav .dt{flex:1;text-align:center;text-transform:capitalize;display:flex;flex-direction:column;gap:2px}
.pill{font-size:11px;color:var(--acc)}
.link{background:none;border:0;color:var(--acc);font:inherit;font-size:12px;padding:0}
.rings{width:100%;max-width:330px;display:block;margin:6px auto}
.rtot{text-align:center;margin:2px 0 6px}.rtot b{display:block;font-size:34px;line-height:1.1}.rtot span{font-size:13px;color:var(--mute)}
.rings .big{font-size:34px;font-weight:700;fill:var(--ink)}
.rings .sm{font-size:12px;fill:var(--mute)}
.tm{width:112px;flex:0 0 auto;margin:0;padding:8px 6px;font-size:14px}
.tt{width:106px;flex:0 0 auto;margin:0;padding:4px 6px;font-size:13px;border-radius:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .hd{text-align:center;font-size:11px;color:var(--mute)}
.cc{aspect-ratio:1;border-radius:10px;background:var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;min-width:0}
.cc small{font-size:10px;color:var(--mute);line-height:1}
.cc em{font-style:normal;font-size:19px;line-height:1.1}
.cc.on{background:var(--acc)}.cc.on small,.cc[style*=background] small{color:#ffffffd0}
.cc.bad{background:color-mix(in srgb,var(--bad) 40%,transparent)}
.cc.off{background:transparent}.cc.fut{opacity:.4}
.yg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.yg h5{margin:0 0 4px;font-size:12px;color:var(--mute);font-weight:600}
.mini .cal{gap:2px}.mini .cc{border-radius:3px}.mini .cc small,.mini .cc em{display:none}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
.big-n{font-size:15px;color:var(--mute);margin:4px 0}.big-n b{font-size:34px;color:var(--ink);margin-right:4px}
.legend .lr{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink);font:inherit;text-align:left}
.legend .lr:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.lr .n{flex:1}
.lr .n small{display:block;color:var(--mute);font-size:12px}
.lr b{font-size:17px}
.pend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--c,var(--acc));border-radius:9px}
.bar.good i{background:var(--ok)}
.bar.over i{background:var(--bad)}
.bar.thin{height:5px;margin:3px 0 0}
small.s{color:var(--mute);font-size:12px}
.kc b{font-size:30px}
.kc span{color:var(--mute);font-size:13px}
.mac{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin:10px 0 4px}
.mac>div{background:var(--bg);border-radius:12px;padding:8px 10px}
.mac b{display:block;font-size:18px}
.mac span{font-size:11.5px;color:var(--mute);display:block}
.mac small{font-size:11px;color:var(--mute)}
.meal{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.mh{display:flex;justify-content:space-between;margin-bottom:6px}
.mh span{color:var(--mute);font-size:13px}
.fe{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line)}
.fi{flex:1;min-width:0}
.fi b{display:block;font-size:14px;font-weight:600}
.fi small{color:var(--mute);font-size:11.5px}
.gi{width:68px!important;margin:0!important;padding:7px 8px!important;text-align:right}
.u{color:var(--mute);font-size:13px}
.x{background:none;border:0;color:var(--mute);font-size:15px;padding:4px 6px}
.star{background:none;border:0;color:var(--mute);font-size:18px;padding:2px 4px}
.star.on{color:var(--star)}
.tb{margin-top:10px}
.tb h4{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:600;text-transform:capitalize}
.tb ul,ul.tl{list-style:none;margin:0 0 8px;padding:0}
.tb li,ul.tl li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.tb li span,ul.tl li span{flex:1}
.tb li.done span,ul.tl li.done span{text-decoration:line-through;color:var(--mute)}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:none;color:#fff;font-size:15px;padding:0;line-height:1;flex:0 0 auto}
.done .ck{background:var(--ok);border-color:var(--ok)}
.empty{color:var(--mute);font-size:13px;margin:0 0 8px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--mute);font-size:9px}
.chart .rf{stroke:var(--mute);stroke-width:1;stroke-dasharray:4 3}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.m{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.m b{display:block;font-size:20px}
.m span{font-size:12px;color:var(--mute)}
.pnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.pnav button{width:40px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px}
.pnav button:disabled{opacity:.3}
.pnav b{text-transform:capitalize}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-template-columns:repeat(15,1fr);grid-auto-flow:column;gap:3px}
.hc{aspect-ratio:1;border-radius:3px;background:color-mix(in srgb,var(--acc) calc(var(--v)*100%),var(--line))}
.hc.off{background:transparent;border:1px dashed var(--line)}
.hr{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.hr span{width:130px;flex:0 0 auto}
.hr .bar{flex:1;margin:0}
.hr em{width:42px;text-align:right;font-style:normal;font-weight:600}
.dr{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 0;color:var(--ink);font:inherit;text-align:left}
.dr span{width:96px;flex:0 0 auto;text-transform:capitalize;font-size:14px}
.dr .bar{flex:1;margin:0}
.dr em{width:46px;text-align:right;font-style:normal;color:var(--mute);font-size:13px}
.btn{display:block;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.d{color:var(--bad)}
p.note{color:var(--mute);font-size:13px;margin:6px 0}
.cfr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.cfr span{flex:1}
.cfr em{font-style:normal;color:var(--mute);font-size:12px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;max-width:90%}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;z-index:30;display:none}
#modal.on{display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
.sheet{width:100%;max-width:480px;height:90vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:20px 20px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 16px)}
.sh-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.sh-head b{flex:1;font-size:16px}
.sh-head .x{font-size:20px}
.fres{max-height:calc(90vh - 270px);overflow:auto;margin-bottom:8px}
.fr{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;color:var(--ink);font:inherit}
.fr .fn{display:block;font-size:15px;font-weight:600}
.fr small{display:block;color:var(--mute);font-size:12px}
.fr .pt{color:var(--acc)}
.prev{margin:6px 0 12px}
</style>
<script src="foods.js"></script>

<body>
<div class="top"><h1>Hábitos</h1><span id="hdate"></span></div>
<main id="view"></main>
<div id="modal"></div>
<nav>
  <button class="tab" data-a="tab" data-v="home"><i>🎯</i>Inicio</button>
  <button class="tab" data-a="tab" data-v="log"><i>✍️</i>Registro</button>
  <button class="tab" data-a="tab" data-v="todo"><i>✅</i>To-Do<b class="nb" id="nb"></b></button>
  <button class="tab" data-a="tab" data-v="stats"><i>📊</i>Métricas</button>
  <button class="tab" data-a="tab" data-v="set"><i>⚙️</i>Ajustes</button>
</nav>
<div id="toast"></div>
<script>
const HABITS=[
 {id:'food',name:'Comer saludable',icon:'🥗',color:'#22c55e'},
 {id:'train',name:'Entrenar',icon:'💪',color:'#f97316'},
 {id:'read',name:'Leer',icon:'📖',color:'#38bdf8'},
 {id:'thanks',name:'Agradecer',icon:'🙏',color:'#facc15'},
 {id:'screen',name:'Pantalla',icon:'📵',color:'#a855f7'},
 {id:'plan',name:'Planificar mañana',icon:'🗓️',color:'#ec4899'},
 {id:'nofap',name:'No fap',icon:'🚫',color:'#14b8a6'}
];
const HB={};HABITS.forEach(h=>HB[h.id]=h);
const MEALS=[['b','Desayuno','🌅'],['l','Almuerzo','🍽️'],['d','Cena','🌙'],['s','Snack','🍎']];
const KEY='habitos_v1';
const DEF=()=>({start:addDays(today(),1),s:{calMin:1600,calMax:2200,protein:100,pagesWeek:70,screenMax:4,exercises:['Gym','Pesas','Correr','Caminar','Ciclismo','Natación','Yoga','Fútbol','Otro'],ntfy:'',theme:'dark'},d:{},t:{},cf:[]});
const MN=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MNF=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYS_ES=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DN=['D','L','M','M','J','V','S'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const r1=v=>Math.round(v*10)/10;
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(k){const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(k,n){const d=parse(k);d.setDate(d.getDate()+n);return key(d)}
function today(){return key(new Date())}
function fmtDate(k){const d=parse(k);return DAYS_ES[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()]}
function nowH(){return new Date().getHours()}
function thanksOpen(k){return k===today()&&nowH()<12}
function screenOpen(k){const t=today();return k<t||(k===t&&nowH()>=21)}

/* ---------- datos ---------- */
let DEMO=false,REAL=null;
let S=load();

function load(){
  let x=null;
  try{x=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  return normalize(x);
}
function normalize(x){
  const b=DEF();
  if(!x||typeof x!=='object')return b;
  const o={start:x.start||b.start,s:Object.assign({},b.s,x.s||{}),d:x.d||{},t:x.t||{},cf:Array.isArray(x.cf)?x.cf:[]};
  
  return o;
}
function applyTheme(){const t=(S&&S.s&&S.s.theme)||'dark';document.documentElement.setAttribute('data-theme',t);const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='light'?'#f3f4f6':'#0b0d12')}
function save(){if(DEMO)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(save.t);save.t=setTimeout(()=>{try{nsync()}catch(e){}},2500)}
function rec(k){return S.d[k]||(S.d[k]={})}
function wk(r){return r.wk||(r.wk={type:'',min:null,note:''})}
function weekPages(k){const r=range('week',k);return listDays(r.a,r.b).reduce((s,d)=>s+((S.d[d]||{}).pages||0),0)}

/* ---------- alimentación ---------- */
const DB_OK=typeof FOODS!=='undefined';
const CATS=typeof FOODS_CATS!=='undefined'?FOODS_CATS:[];
function mealList(r,m){return (r.m&&r.m[m])||[]}
function eMac(e){const f=e.g/100;return{k:e.b[0]*f,p:e.b[1]*f,f:e.b[2]*f,c:e.b[3]*f}}
function sumMac(list){const t={k:0,p:0,f:0,c:0,n:0};list.forEach(e=>{const x=eMac(e);t.k+=x.k;t.p+=x.p;t.f+=x.f;t.c+=x.c;t.n++});return t}
function dayFood(k){
  const r=S.d[k]||{};let all=[];
  MEALS.forEach(m=>{all=all.concat(mealList(r,m[0]))});
  const t=sumMac(all);
  if(!t.n&&r.cal!=null){t.k=r.cal;t.n=1}
  return t;
}
function macLine(x){return Math.round(x.k)+' kcal · P '+r1(x.p)+' · G '+r1(x.f)+' · C '+r1(x.c)}
function foodSummary(k){
  const t=dayFood(k),s=S.s,mk=(t.p*4+t.f*9+t.c*4)||1;
  const pct=Math.min(100,t.k/s.calMax*100);
  const cls=t.k>s.calMax?'over':(t.k>=s.calMin?'good':'');
  const pp=Math.min(100,t.p/s.protein*100);
  let msg='Meta: '+s.calMin+'–'+s.calMax+' kcal';
  if(t.n){msg+=t.k<s.calMin?' · faltan '+Math.round(s.calMin-t.k)+' para el mínimo':(t.k>s.calMax?' · te pasaste '+Math.round(t.k-s.calMax)+' kcal':' · ✓ dentro del rango')}
  return '<div class="kc"><b>'+Math.round(t.k)+'</b><span> kcal consumidas (estimado)</span></div>'+
  '<div class="bar '+cls+'"><i style="width:'+pct+'%"></i></div><small class="s">'+msg+'</small>'+
  '<div class="mac"><div><b>'+r1(t.p)+' g</b><span>Proteína</span><small>'+Math.round(t.p*4/mk*100)+'% kcal · meta '+s.protein+' g</small><div class="bar thin" style="--c:#38bdf8"><i style="width:'+pp+'%"></i></div></div>'+
  '<div><b>'+r1(t.f)+' g</b><span>Grasas</span><small>'+Math.round(t.f*9/mk*100)+'% kcal</small></div>'+
  '<div><b>'+r1(t.c)+' g</b><span>Carbohidratos</span><small>'+Math.round(t.c*4/mk*100)+'% kcal</small></div></div>';
}

/* catálogo y búsqueda */
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
let FN=null;
function allFoods(){
  const base=DB_OK?FOODS:[];
  const cf=S.cf.map(c=>[c.n,99,c.k,c.p,c.f,c.c,c.g||100,c.l||'1 porción']);
  return base.concat(cf);
}
function normNames(list){
  const n=DB_OK?FOODS.length:0;
  if(!FN||FN.length!==n)FN=(DB_OK?FOODS:[]).map(f=>norm(f[0]));
  return list.map((f,i)=>i<n?FN[i]:norm(f[0]));
}
function recents(){
  const names=[],seen={};let k=today();
  for(let i=0;i<60&&names.length<30;i++){
    const r=S.d[k];
    if(r&&r.m)MEALS.forEach(m=>mealList(r,m[0]).forEach(e=>{if(!seen[e.n]){seen[e.n]=1;names.push(e.n)}}));
    k=addDays(k,-1);
  }
  return names;
}
function findResults(){
  const list=allFoods(),nn=normNames(list),q=norm(fm.q).trim();
  const toks=q.split(/\s+/).filter(Boolean),catSel=fm.cat!=='all'&&fm.cat!=='rec';
  if(fm.cat==='rec'&&!toks.length){
    const map={};list.forEach((f,i)=>{map[f[0]]=i});
    return recents().map(n=>map[n]).filter(i=>i!=null);
  }
  const sc=[];
  for(let i=0;i<list.length;i++){
    const f=list[i];
    if(catSel&&String(f[1])!==String(fm.cat))continue;
    if(!toks.length){if(!catSel)continue;sc.push([0,i]);continue}
    const nm=nn[i];let ok=true;
    for(let j=0;j<toks.length;j++){if(nm.indexOf(toks[j])<0){ok=false;break}}
    if(!ok)continue;
    sc.push([nm.indexOf(toks[0])===0?0:(nm.indexOf(' '+toks[0])>=0?1:2),i]);
  }
  if(!toks.length)sc.sort((a,b)=>list[a[1]][0].localeCompare(list[b[1]][0],'es'));
  else sc.sort((a,b)=>a[0]-b[0]||list[a[1]][0].length-list[b[1]][0].length);
  return sc.slice(0,catSel&&!toks.length?300:60).map(x=>x[1]);
}

/* ---------- periodos ---------- */
function range(p,ref){
  const d=parse(ref);let a,b;
  if(p==='day'){a=b=ref}
  else if(p==='week'){const w=(d.getDay()+6)%7;a=addDays(ref,-w);b=addDays(a,6)}
  else if(p==='month'){a=key(new Date(d.getFullYear(),d.getMonth(),1));b=key(new Date(d.getFullYear(),d.getMonth()+1,0))}
  else{a=d.getFullYear()+'-01-01';b=d.getFullYear()+'-12-31'}
  return {a,b};
}
function listDays(a,b){const o=[];let k=a;while(k<=b){o.push(k);k=addDays(k,1)}return o}
function activeDays(a,b){const t=today();return listDays(a,b).filter(k=>k>=S.start&&k<=t)}
function shift(ref,p,n){
  const d=parse(ref);
  if(p==='week')d.setDate(d.getDate()+7*n);
  else if(p==='month'){d.setDate(1);d.setMonth(d.getMonth()+n)}
  else{d.setMonth(0,1);d.setFullYear(d.getFullYear()+n)}
  return key(d);
}
function plabel(p,ref){
  const r=range(p,ref),A=parse(r.a),B=parse(r.b);
  if(p==='week')return A.getDate()+' '+MN[A.getMonth()]+' – '+B.getDate()+' '+MN[B.getMonth()];
  if(p==='month')return MNF[A.getMonth()]+' '+A.getFullYear();
  return String(A.getFullYear());
}

/* ---------- cumplimiento ---------- */
function trainOk(r){return !!(r.trainDone||(r.wk&&r.wk.type))}
function readOk(r){return !!(r.readDone||r.pages>0)}
function dayScore(h,k){
  const r=S.d[k]||{},s=S.s;
  switch(h){
    case 'food':{const t=dayFood(k);return t.n&&t.k>=s.calMin&&t.k<=s.calMax?1:0}
    case 'train':return trainOk(r)?1:0;
    case 'read':return readOk(r)?1:0;
    case 'thanks':return r.thanksDone?1:0;
    case 'screen':return r.screen!=null&&r.screen<s.screenMax?1:0;
    case 'plan':return (S.t[addDays(k,1)]||[]).length>0?1:0;
    case 'nofap':return r.relapse?0:1;
  }
  return 0;
}
function okDay(h,k){return dayScore(h,k)>=1}
function scoreP(h,days){if(!days.length)return null;return days.reduce((s,k)=>s+dayScore(h,k),0)/days.length}
function streaks(h){
  const t=today();let best=0,run=0,cur=0;
  listDays(S.start,t).forEach(k=>{if(okDay(h,k)){run++;best=Math.max(best,run)}else run=0});
  let k=okDay(h,t)?t:addDays(t,-1);
  while(k>=S.start&&okDay(h,k)){cur++;k=addDays(k,-1)}
  return {cur,best};
}
function status(h,k){
  const r=S.d[k]||{},s=S.s;
  switch(h){
    case 'food':{
      const t=dayFood(k);
      if(!t.n)return{c:'',t:'Pendiente'};
      if(t.k>s.calMax)return{c:'bad',t:Math.round(t.k)+' kcal · sobre la meta'};
      if(t.k>=s.calMin)return{c:'ok',t:'✓ '+Math.round(t.k)+' kcal'};
      return{c:'',t:Math.round(t.k)+' kcal'};
    }
    case 'train':return trainOk(r)?{c:'ok',t:'✓ '+((r.wk&&r.wk.type)||'Hecho')}:{c:'',t:'Pendiente'};
    case 'read':{const p=r.pages||0;return readOk(r)?{c:'ok',t:'✓ '+(p?p+' págs':'Hecho')}:{c:'',t:'Pendiente'}}
    case 'thanks':
      if(r.thanksDone)return{c:'ok',t:'✓ Hecho'};
      return thanksOpen(k)?{c:'',t:'Hasta las 12:00'}:{c:'bad',t:'No marcado'};
    case 'screen':
      if(r.screen==null)return screenOpen(k)?{c:'',t:'Pendiente'}:{c:'',t:'Desde las 9 PM'};
      return r.screen<s.screenMax?{c:'ok',t:'✓ '+r.screen+' h'}:{c:'bad',t:r.screen+' h · excedido'};
    case 'plan':{const n=(S.t[addDays(k,1)]||[]).length;return n?{c:'ok',t:'✓ '+n+' tarea'+(n>1?'s':'')}:{c:'',t:'Sin planificar'}}
    case 'nofap':return r.relapse?{c:'bad',t:'Recaída'}:{c:'ok',t:'✓ Limpio'};
  }
}
function sub(h,days){const n=days.length;if(!n)return 'Sin datos aún';return days.filter(k=>okDay(h,k)).length+'/'+n+' días cumplidos'}

function ringsSvg(p){
  const r=range(p,today()),days=activeDays(r.a,r.b);
  const sc=HABITS.map(h=>scoreP(h.id,days));
  const avg=days.length?sc.reduce((s,v)=>s+(v||0),0)/sc.length:null;
  let s='<svg viewBox="0 0 320 320" class="rings">';
  HABITS.forEach((h,i)=>{
    const rad=150-i*20,C=2*Math.PI*rad,v=sc[i]||0;
    s+='<circle cx="160" cy="160" r="'+rad+'" fill="none" stroke="'+h.color+'" stroke-opacity=".18" stroke-width="16"/>';
    if(v>=0.01)s+='<circle cx="160" cy="160" r="'+rad+'" fill="none" stroke="'+h.color+'" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-v))+'" transform="rotate(-90 160 160)"/>';
  });
  s+='</svg><div class="rtot"><b>'+(avg==null?'–':Math.round(avg*100)+'%')+'</b><span>cumplimiento global</span></div>';
  return {svg:s,sc,days};
}

  return card('train','<div class="chips">'+S.s.exercises.map((x,i)=>'<button class="chip '+(w.type===x?'on':'')+'" data-a="ex" data-v="'+i+'">'+esc(x)+'</button>').join('')+'</div><div class="row"><input type="number" inputmode="numeric" data-f="wkmin" placeholder="Minutos" value="'+(w.min==null?'':w.min)+'"><input type="text" data-f="wknote" placeholder="Detalle (ej. pecho, 5 km)" value="'+esc(w.note||'')+'"></div><small class="s">Elige el tipo de ejercicio para validar el día. Toca de nuevo para quitarlo.</small>',k);

function readCard(k){
  const r=S.d[k]||{},g=S.s.pagesWeek,wp=weekPages(k),pct=Math.min(100,Math.round(wp/g*100));
  return card('read','<label class="l">Páginas leídas este día (con más de 0 se valida el día)</label><div class="row"><input type="number" inputmode="numeric" data-f="pages" placeholder="0" value="'+(r.pages||'')+'"><button class="chip" data-a="addpg" data-v="10">+10</button><button class="chip" data-a="addpg" data-v="20">+20</button></div><div class="bar"><i id="rbar" style="width:'+pct+'%"></i></div><small class="s" id="rtxt">Semana: '+wp+' de '+g+' páginas ('+pct+'%)</small>',k);
}
function nofapCard(k){
  const r=S.d[k]||{};
  const b=r.relapse
    ?'<p class="note">Registraste una recaída este día. La racha se reinicia desde mañana. Tus días acumulados los ves en Métricas.</p><button class="chip" data-a="relapse">Deshacer: no hubo recaída</button>'
    :'<p class="note">Se da por cumplido por defecto. Solo márcalo si ocurrió una recaída.</p><button class="chip" data-a="relapse">Registrar recaída</button>';

function todoListForm(d){
  const list=sortedTodos(d);

  '<form data-a="addtodo" data-d="'+d+'" class="row"><input type="text" name="t" placeholder="Nueva tarea" autocomplete="off"><input type="time" name="tm" class="tm" title="Hora del aviso (opcional)"><button class="chip on">Añadir</button></form>';
}
function todoBlock(d,title){
  const list=S.t[d]||[],done=list.filter(x=>x.done).length;
  return '<div class="tb"><h4>'+title+(list.length?' · '+done+'/'+list.length:'')+'</h4>'+todoListForm(d)+'</div>';
}
function viewLog(){
  const k=ui.date,t=today();
  let o=dateNav(k,'dprev','dnext','dtoday',t);
  o+=thanksCard(k)+foodCard(k);
  o+=trainCard(k)+readCard(k);

function liveUpdate(){
  if(ui.tab!=='log')return;
  const k=ui.date,r=S.d[k]||{};

  const fs=$('#fsum');if(fs)fs.innerHTML=foodSummary(k);

/* ---------- TO-DO ---------- */
function sortedTodos(d){return (S.t[d]||[]).slice().sort((a,b)=>((a.done?1:0)-(b.done?1:0))||((b.star?1:0)-(a.star?1:0))||((a.time?0:1)-(b.time?0:1))||String(a.time||'').localeCompare(b.time||''))}
function todoItem(d,x){
  return '<li class="'+(x.done?'done':'')+'"><button class="ck" data-a="ttog" data-d="'+d+'" data-i="'+x.id+'">'+(x.done?'✓':'')+'</button><span>'+esc(x.text)+'</span><input type="time" class="tt" data-f="ttime" data-d="'+d+'" data-i="'+x.id+'" value="'+(x.time||'')+'" title="Hora del aviso"><button class="star '+(x.star?'on':'')+'" data-a="tstar" data-d="'+d+'" data-i="'+x.id+'">'+(x.star?'★':'☆')+'</button><button class="x" data-a="tmove" data-to="next" data-d="'+d+'" data-i="'+x.id+'" title="Pasar al día siguiente">➜</button><button class="x" data-a="tdel" data-d="'+d+'" data-i="'+x.id+'">✕</button></li>';
}
function overdue(){
  const t=today(),out=[];
  Object.keys(S.t).filter(d=>d<t).sort().reverse().forEach(d=>{S.t[d].filter(x=>!x.done).forEach(x=>out.push([d,x]))});
  return out;
}
function tdOk(k){const l=S.t[k]||[];return l.length>0&&l.every(x=>x.done)}
function viewTodo(){
  const ov=overdue();
  let o=segHtml('tv',ui.tv,[['day','Día'],['pend','Pendientes'+(ov.length?' ('+ov.length+')':'')],['seg','Seguimiento']]);
  if(ui.tv==='pend')return o+todoPend(ov);
  if(ui.tv==='seg')return o+todoSeg();
  return o+todoDay(ov);
}
function todoDay(ov){
  const d=ui.td,t=today(),l=S.t[d]||[],done=l.filter(x=>x.done).length,pct=l.length?Math.round(done/l.length*100):0;
  let o=dateNav(d,'tprev','tnext','ttoday',addDays(t,14));
  if(d===t&&ov.length)o+='<button class="btn" data-a="tv" data-v="pend">⚠️ Tienes '+ov.length+' tarea'+(ov.length>1?'s':'')+' pendiente'+(ov.length>1?'s':'')+' de días anteriores</button>';
  o+='<div class="card"><b>'+done+'/'+l.length+' tareas completadas</b> <span class="badge '+(l.length&&done===l.length?'ok':'')+'">'+pct+'%</span><div class="bar '+(l.length&&done===l.length?'good':'')+'"><i style="width:'+pct+'%"></i></div>';
  o+=todoListForm(d);
  o+='<small class="s">★ prioridad · ➜ pasar al día siguiente</small></div>';
  const n=addDays(d,1),nl=S.t[n]||[];
  o+='<div class="card"><b>🗓️ Planifica '+fmtDate(n)+'</b>'+(nl.length?' <span class="badge">'+nl.length+' tarea'+(nl.length>1?'s':'')+'</span>':'')+todoListForm(n)+'</div>';
  return o;
}
function todoPend(ov){
  if(!ov.length)return '<div class="card"><b>🎉 Sin pendientes atrasados</b><p class="note">Todo lo de días anteriores está completado o movido.</p></div>';
  const groups={};ov.forEach(p=>{(groups[p[0]]=groups[p[0]]||[]).push(p[1])});
  let o='<button class="btn p" data-a="tpall">Pasar todo a hoy ('+ov.length+')</button>';
  Object.keys(groups).sort().reverse().forEach(d=>{
    o+='<div class="card"><b style="text-transform:capitalize">'+fmtDate(d)+'</b><ul class="tl">'+groups[d].map(x=>'<li><button class="ck" data-a="ttog" data-d="'+d+'" data-i="'+x.id+'"></button><span>'+esc(x.text)+'</span><button class="chip" data-a="tmove" data-to="today" data-d="'+d+'" data-i="'+x.id+'">→ Hoy</button><button class="x" data-a="tdel" data-d="'+d+'" data-i="'+x.id+'">✕</button></li>').join('')+'</ul></div>';
  });
  return o;
}
function todoSeg(){
  const t=today(),days14=listDays(addDays(t,-13),t);
  const items=days14.map(k=>{const l=S.t[k]||[];return{label:String(parse(k).getDate()),v:l.length?l.filter(x=>x.done).length/l.length*100:null}});
  function tp(p){const r=range(p,t);let tot=0,dn=0;listDays(r.a,r.b).filter(k=>k<=t).forEach(k=>{const l=S.t[k]||[];tot+=l.length;dn+=l.filter(x=>x.done).length});return{tot,dn}}
  function pc(x){return x.tot?Math.round(x.dn/x.tot*100)+'%':'–'}
  const wk=tp('week'),mo=tp('month'),yr=tp('year');
  let best=0,run=0;listDays(S.start,t).forEach(k=>{if(tdOk(k)){run++;best=Math.max(best,run)}else run=0});
  let cur=0,k=tdOk(t)?t:addDays(t,-1);while(k>=S.start&&tdOk(k)){cur++;k=addDays(k,-1)}
  const byW=[0,1,2,3,4,5,6].map(()=>({tot:0,dn:0}));
  Object.keys(S.t).filter(d=>d<=t).forEach(d=>{const w=parse(d).getDay();S.t[d].forEach(x=>{byW[w].tot++;if(x.done)byW[w].dn++})});
  let bw=-1,br=-1;byW.forEach((x,i)=>{if(x.tot>=3&&x.dn/x.tot>br){br=x.dn/x.tot;bw=i}});
  const total=Object.keys(S.t).reduce((s,d)=>s+S.t[d].filter(x=>x.done).length,0);
  let o='<div class="card"><b>Tareas completadas por día (últimos 14 días)</b>'+barChart(items,{max:100,color:'var(--acc)'})+'</div>';
  o+='<div class="grid"><div class="m"><b>'+pc(wk)+'</b><span>Esta semana ('+wk.dn+'/'+wk.tot+')</span></div><div class="m"><b>'+pc(mo)+'</b><span>Este mes ('+mo.dn+'/'+mo.tot+')</span></div><div class="m"><b>'+pc(yr)+'</b><span>Este año ('+yr.dn+'/'+yr.tot+')</span></div><div class="m"><b>'+total+'</b><span>Tareas completadas en total</span></div><div class="m"><b>'+cur+' días</b><span>Racha de días 100% completos</span></div><div class="m"><b>'+best+' días</b><span>Mejor racha</span></div><div class="m"><b>'+overdue().length+'</b><span>Pendientes atrasadas</span></div><div class="m"><b style="text-transform:capitalize">'+(bw>=0?DAYS_ES[bw]:'–')+'</b><span>Día más productivo</span></div></div>';
  o+='<div class="card"><b>Historial reciente</b>'+days14.slice().reverse().map(k=>{const l=S.t[k]||[],dn=l.filter(x=>x.done).length,p=l.length?Math.round(dn/l.length*100):0;return '<button class="dr" data-a="topen" data-v="'+k+'"><span>'+fmtDate(k)+'</span><div class="bar '+(l.length&&dn===l.length?'good':'')+'"><i style="width:'+p+'%"></i></div><em>'+(l.length?dn+'/'+l.length:'–')+'</em></button>'}).join('')+'</div>';
  return o;
}

/* ---------- MÉTRICAS ---------- */
function niceMax(m){const mag=Math.pow(10,Math.floor(Math.log10(m)));return Math.ceil(m/mag)*mag}
function fmtN(v){return v>=100?String(Math.round(v)):String(+v.toFixed(1))}
function barChart(items,o){
  const W=340,H=180,L=34,R=6,T=10,B=22,iw=W-L-R,ih=H-T-B,n=items.length,bw=iw/n;
  let max=o.max;
  if(!max){
    const vs=items.map(i=>i.v).filter(v=>v!=null).concat(o.refs||[]).concat([1]);
    max=niceMax(Math.max.apply(null,vs)*1.1);
  }
  const y=v=>T+ih-(v/max)*ih;
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="chart">';
  [0,.5,1].forEach(f=>{const v=max*f;s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="tx" x="'+(L-4)+'" y="'+(y(v)+3)+'" text-anchor="end">'+fmtN(v)+'</text>'});
  items.forEach((it,i)=>{
    const x=L+i*bw+bw*.15,w=bw*.7;
    if(it.v!=null){const h=Math.max(1.5,(Math.min(it.v,max)/max)*ih);s+='<rect x="'+x.toFixed(1)+'" y="'+(T+ih-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="'+Math.min(4,w/2).toFixed(1)+'" style="fill:'+o.color+'"/>'}
    if(n<=12||i===0||(i+1)%5===0)s+='<text class="tx" x="'+(L+i*bw+bw/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+it.label+'</text>';
  });
  (o.refs||[]).forEach(v=>{s+='<line class="rf" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/>'});
  return s+'</svg>';
}
function groupsFor(p,ref){
  const r=range(p,ref);
  if(p==='year'){
    const y=parse(r.a).getFullYear(),g=[];
    for(let m=0;m<12;m++)g.push({label:MN[m],days:listDays(key(new Date(y,m,1)),key(new Date(y,m+1,0)))});
    return g;
  }
  return listDays(r.a,r.b).map(k=>({label:p==='week'?DN[parse(k).getDay()]:String(parse(k).getDate()),days:[k]}));
}
function valueOf(h,days,ym){
  if(!days.length)return null;
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  switch(h){
    case 'food':return avg(days.map(k=>dayFood(k)).filter(t=>t.n).map(t=>t.k));
    case 'screen':return avg(days.map(k=>(S.d[k]||{}).screen).filter(v=>v!=null));
    case 'train':return days.reduce((s,k)=>s+((((S.d[k]||{}).wk)||{}).min||0),0);
    case 'read':{const t=days.reduce((s,k)=>s+((S.d[k]||{}).pages||0),0);return ym?t/days.length*7:t}
    case 'plan':return days.reduce((s,k)=>s+(S.t[k]||[]).filter(x=>x.done).length,0);
  }
  return null;
}
function metricsFor(h,days){
  const n=days.length,ok=days.filter(k=>okDay(h,k)).length,m=[];
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  if(h==='food'){
    const ts=days.map(k=>dayFood(k)).filter(t=>t.n);
    m.push(['Días en rango',ok+'/'+n],['Calorías promedio',ts.length?Math.round(avg(ts.map(t=>t.k)))+' kcal':'–'],['Máx. / mín. diario',ts.length?Math.round(Math.max.apply(null,ts.map(t=>t.k)))+' / '+Math.round(Math.min.apply(null,ts.map(t=>t.k))):'–'],['Proteína promedio',ts.length?Math.round(avg(ts.map(t=>t.p)))+' g':'–'],['Grasas promedio',ts.length?Math.round(avg(ts.map(t=>t.f)))+' g':'–'],['Carbohidratos promedio',ts.length?Math.round(avg(ts.map(t=>t.c)))+' g':'–']);
  }
  if(h==='train'){
    const w=days.map(k=>S.d[k]||{}).filter(r=>r.wk&&r.wk.type),cnt={};
    w.forEach(r=>{cnt[r.wk.type]=(cnt[r.wk.type]||0)+1});
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    m.push(['Días entrenados',ok+'/'+n],['Minutos totales',w.reduce((s,r)=>s+(+r.wk.min||0),0)],['Ejercicio más frecuente',top?top[0]+' ('+top[1]+')':'–']);
  }
  if(h==='read'){const tot=days.reduce((s,k)=>s+((S.d[k]||{}).pages||0),0);m.push(['Días leídos',ok+'/'+n],['Páginas totales',tot],['Promedio semanal',n?Math.round(tot/n*7)+' págs':'–'])}
  if(h==='thanks')m.push(['Días agradecidos',ok+'/'+n]);
  if(h==='nofap')m.push(['Días limpios',ok+'/'+n],['Recaídas',n-ok]);
  if(h==='screen'){const c=days.map(k=>(S.d[k]||{}).screen).filter(v=>v!=null);m.push(['Promedio diario',c.length?avg(c).toFixed(1)+' h':'–'],['Mejor día',c.length?Math.min.apply(null,c)+' h':'–'],['Días sobre el límite',c.filter(v=>v>=S.s.screenMax).length],['Días registrados',c.length+'/'+n])}
  if(h==='plan'){let tot=0,dn=0;days.forEach(k=>{const l=S.t[k]||[];tot+=l.length;dn+=l.filter(x=>x.done).length});m.push(['Días planificados',ok+'/'+n],['Tareas completadas',tot?dn+'/'+tot:'–'],['% de tareas',tot?Math.round(dn/tot*100)+'%':'–'])}
  return m;
}
function heatmap(){
  const t=today(),weeks=15,a=range('week',t).a,st=addDays(a,-7*(weeks-1));
  let c='';
  for(let w=0;w<weeks;w++)for(let d=0;d<7;d++){
    const k=addDays(st,w*7+d);
    if(k>t||k<S.start){c+='<i class="hc off"></i>';continue}
    const v=HABITS.reduce((s,h)=>s+dayScore(h.id,k),0)/HABITS.length;
    c+='<i class="hc" style="--v:'+v.toFixed(2)+'" title="'+k+'"></i>';
  }
  return '<div class="heat">'+c+'</div>';
}
const EXI={Gym:'🏋️',Pesas:'🏋️',Correr:'👟',Caminar:'🚶',Ciclismo:'🚴',Natación:'🏊',Yoga:'🧘',Fútbol:'⚽',Otro:'⭐'};
function exIcon(t){return EXI[t]||'🏅'}
const TONE={ok:'var(--ok)',warn:'#eab308',bad:'var(--bad)'};
function foodTone(v){
  const a=S.s.calMin,b=S.s.calMax;
  if(v>=a&&v<=b)return 'ok';
  const tol=(a+b)/2*0.1;
  return (v<a&&a-v<=tol)||(v>b&&v-b<=tol)?'warn':'bad';
}
function mBox(l,v){return '<div class="m"><b>'+v+'</b><span>'+l+'</span></div>'}
function tBox(l,v,tone){const c=TONE[tone];return '<div class="m" style="border-color:'+c+';background:color-mix(in srgb,'+c+' 13%,var(--card))"><b style="color:'+c+'">'+v+'</b><span>'+l+'</span></div>'}
function dd(n){return n+(n===1?' día':' días')}
function fmtHr(h){return h<1?Math.round(h*60)+' min':(+h.toFixed(1))+' h'}
const avgOf=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function lineChart(items,o){
  const W=340,H=190,L=40,R=10,T=12,B=22,iw=W-L-R,ih=H-T-B,n=items.length;
  const vs=items.map(i=>i.v).filter(v=>v!=null).concat([o.hi||0]);
  const max=niceMax(Math.max.apply(null,vs.concat([1]))*1.1),y=v=>T+ih-(v/max)*ih;
  const x=i=>n>1?L+i*iw/(n-1):L+iw/2;
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="chart">';
  if(o.lo!=null)s+='<rect x="'+L+'" y="'+y(o.hi)+'" width="'+iw+'" height="'+(y(o.lo)-y(o.hi))+'" style="fill:var(--ok);opacity:.14"/>';
  [0,.5,1].forEach(f=>{const v=max*f;s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="tx" x="'+(L-4)+'" y="'+(y(v)+3)+'" text-anchor="end">'+fmtN(v)+'</text>'});
  if(o.lo!=null)[o.lo,o.hi].forEach(v=>{s+='<line class="rf" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/>'});
  let d='';items.forEach((it,i)=>{if(it.v==null){d+=' ';return}d+=(d.endsWith(' ')||d===''?'M':'L')+x(i).toFixed(1)+' '+y(it.v).toFixed(1)});
  s+='<path d="'+d.trim()+'" fill="none" stroke="var(--mute)" stroke-width="1.6" stroke-linejoin="round"/>';
  items.forEach((it,i)=>{
    if(it.v!=null)s+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(it.v).toFixed(1)+'" r="'+(n>20?3:4.2)+'" style="fill:'+TONE[it.tone||'ok']+'"/>';
    if(n<=12||i===0||(i+1)%5===0)s+='<text class="tx" x="'+x(i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+it.label+'</text>';
  });
  return s+'</svg>';
}
function calGrid(p,ref,fn){
  const t=today(),r=range(p,ref);
  const cell=(k)=>{
    const ok=k>=S.start&&k<=t,c=ok?fn(k):null,dd=parse(k).getDate();
    if(!c)return '<i class="cc '+(ok?'':'fut')+'"><small>'+dd+'</small></i>';
    return '<i class="cc '+(c.cls||'')+'" style="'+(c.bg?'background:'+c.bg:'')+'" title="'+k+'"><small>'+dd+'</small>'+(c.ic?'<em>'+c.ic+'</em>':'')+'</i>';
  };
  const month=(a,b)=>{
    const off=(parse(a).getDay()+6)%7;let h='';
    for(let i=0;i<off;i++)h+='<i class="cc off"></i>';
    listDays(a,b).forEach(k=>{h+=cell(k)});return h;
  };
  const head=['L','M','M','J','V','S','D'].map(x=>'<div class="hd">'+x+'</div>').join('');
  if(p==='year'){
    const y=parse(r.a).getFullYear();let o='<div class="yg">';
    for(let m=0;m<12;m++)o+='<div class="mini"><h5>'+MN[m]+'</h5><div class="cal">'+month(key(new Date(y,m,1)),key(new Date(y,m+1,0)))+'</div></div>';
    return o+'</div>';
  }
  return '<div class="cal">'+head+month(r.a,r.b)+'</div>';
}
function viewStats(){
  let h=ui.sh;if(h==='plan')h=ui.sh='all';
  const p=ui.sp,ref=ui.sref,r=range(p,ref),days=activeDays(r.a,r.b),t=today(),n=days.length;
  const canFwd=range(p,shift(ref,p,1)).a<=t;
  const MH=HABITS.filter(x=>x.id!=='plan');

/* ---------- avisos de tareas (ntfy programado) ---------- */
function ncancel(x){
  if(!x)return;
  if(x.nid&&S.s.ntfy)fetch('https://ntfy.sh/'+encodeURIComponent(S.s.ntfy)+'/'+x.nid,{method:'DELETE'}).catch(()=>{});
  delete x.nid;delete x.nat;
}
function nsync(){
  if(DEMO||!S.s.ntfy||!navigator.onLine)return;
  const now=Date.now();
  Object.keys(S.t).forEach(d=>{(S.t[d]||[]).forEach(x=>{
    let ms=-1;
    if(x.time){const hm=x.time.split(':').map(Number),dt=parse(d);dt.setHours(hm[0],hm[1],0,0);ms=dt-now}
    const want=x.time&&!x.done&&ms>15000&&ms<70*3600000,stamp=d+' '+x.time;
    if(!want){if(x.nid||x.nat){if(ms>0)ncancel(x);else{delete x.nid;delete x.nat}}return}
    if(x.nat===stamp)return;
    if(x.nid)ncancel(x);
    x.nat=stamp;
    fetch('https://ntfy.sh/',{method:'POST',body:JSON.stringify({topic:S.s.ntfy,title:'⏰ To-Do',message:x.text,delay:Math.round(ms/1000)+'s',priority:4,tags:['alarm_clock'],click:location.href.split('#')[0]})})
      .then(r=>r.json()).then(j=>{if(j&&j.id){x.nid=j.id;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}}).catch(()=>{x.nat=''});
  })});
}
setTimeout(()=>{try{nsync()}catch(e){}},1500);

function modalAction(a,el,v){
  switch(a){
    case 'fopen':openFood(v);return true;
    case 'fclose':closeFood();return true;
    case 'fback':fm.step='list';renderModal();return true;
    case 'fcat':fm.cat=v;renderModal();return true;

  return false;
}

      const r=rec(ui.date);
      if(!thanksOpen(ui.date)){toast('La ventana de gratitud cierra a las 12:00');return}
      r.thanksDone=!r.thanksDone;save();break;
    }
    case 'demo':REAL=S;S=makeDemo();DEMO=true;ui.tab='home';ui.date=today();toast('Modo demo activado');window.scrollTo(0,0);break;
    case 'demoexit':if(REAL)S=REAL;REAL=null;DEMO=false;ui.tab='set';ui.date=today();toast('Datos reales restaurados');window.scrollTo(0,0);break;
    case 'theme':S.s.theme=v;if(REAL)REAL.s.theme=v;try{localStorage.setItem(KEY,JSON.stringify(DEMO?REAL:S))}catch(e){}applyTheme();break;
    case 'relapse':{const r=rec(ui.date);r.relapse=!r.relapse;save();break}
    case 'ex':{const r=rec(ui.date),x=S.s.exercises[+v],w=wk(r);w.type=w.type===x?'':x;r.trainDone=false;save();break}
    case 'addpg':{const r=rec(ui.date);r.pages=(r.pages||0)+(+v);r.readDone=false;save();break}
    case 'fdel':{const l=mealList(rec(ui.date),el.dataset.m);l.splice(+el.dataset.i,1);save();break}
    case 'tv':ui.tv=v;break;
    case 'tprev':ui.td=addDays(ui.td,-1);break;
    case 'tnext':if(ui.td<addDays(t,14))ui.td=addDays(ui.td,1);break;
    case 'ttoday':ui.td=t;break;
    case 'topen':ui.td=v;ui.tv='day';window.scrollTo(0,0);break;
    case 'ttog':{const x=findTodo(el.dataset.d,el.dataset.i);if(x){x.done=!x.done;save()}break}
    case 'tstar':{const x=findTodo(el.dataset.d,el.dataset.i);if(x){x.star=!x.star;save()}break}
    case 'tdel':{ncancel(findTodo(el.dataset.d,el.dataset.i));S.t[el.dataset.d]=(S.t[el.dataset.d]||[]).filter(i=>i.id!==el.dataset.i);save();break}
    case 'tmove':{const d=el.dataset.d,to=el.dataset.to==='today'?t:addDays(d,1);moveTodo(d,el.dataset.i,to);save();toast(el.dataset.to==='today'?'Movida a hoy':'Pasada a '+fmtDate(to));break}
    case 'tpall':{overdue().forEach(p=>moveTodo(p[0],p[1].id,t));save();toast('Pendientes pasadas a hoy');ui.tv='day';ui.td=t;break}
    case 'sp':ui.sp=v;ui.sref=t;break;
    case 'sh':ui.sh=v;if(v==='all'||v==='thanks'||v==='nofap')ui.mode='pct';break;
    case 'sm':ui.mode=v;break;
    case 'snav':ui.sref=shift(ui.sref,ui.sp,+v);break;
    case 'cfdel':S.cf.splice(+el.dataset.i,1);save();break;
    case 'ntest':ntest();return;
    case 'export':doExport();return;
    case 'reset':if(confirm('¿Borrar TODOS los datos? Esto no se puede deshacer.')){S=DEF();save();toast('Datos borrados')}else return;break;
    default:return;
  }
  render();
});
document.addEventListener('input',e=>{
  const el=e.target,f=el.dataset&&el.dataset.f;if(!f)return;
  if(f.indexOf('m.')===0){modalInput(f,el);return}
  const num=el.value===''?null:parseFloat(el.value);
  if(f.indexOf('s.')===0){
    const k=f.slice(2);
    if(k==='exercises'){const l=el.value.split(',').map(x=>x.trim()).filter(Boolean);if(l.length)S.s.exercises=l}
    else if(k==='ntfy')S.s.ntfy=el.value.trim();
    else if(num!=null&&!isNaN(num))S.s[k]=num;
    save();return;
  }
  if(f==='start'){if(el.value){S.start=el.value;save()}return}
  if(f==='ttime'){const x=findTodo(el.dataset.d,el.dataset.i);if(x){x.time=el.value||'';save()}return}
  const r=rec(ui.date);
  if(f==='screen'){if(!screenOpen(ui.date))return;r.screen=num}
  else if(f==='pages'){r.pages=num||0;r.readDone=false}
  else if(f==='wkmin')wk(r).min=num;
  else if(f==='wknote')wk(r).note=el.value;
  else if(f==='eg'){const l=mealList(r,el.dataset.m),en=l[+el.dataset.i];if(en)en.g=num||0}
  save();liveUpdate();
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;if(f.dataset.a!=='addtodo')return;
  const v=f.t.value.trim();if(!v)return;
  const d=f.dataset.d;
  (S.t[d]=S.t[d]||[]).push({id:nid(),text:v,done:false,star:false,time:f.tm.value||''});
  save();render();
  const inp=document.querySelector('form[data-d="'+d+'"] input');if(inp)inp.focus();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.a==='import'&&el.files&&el.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{
      try{S=normalize(JSON.parse(fr.result));save();render();toast('Respaldo importado')}
      catch(err){toast('Archivo no válido')}
    };
    fr.readAsText(el.files[0]);
  }
});
function doExport(){
  try{
    const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='habitos-'+today()+'.json';
    document.body.appendChild(a);a.click();a.remove();toast('Respaldo exportado');
  }catch(err){toast('No se pudo exportar')}
}
function ntest(){
  if(!S.s.ntfy){toast('Escribe primero tu tema de ntfy');return}
  fetch('https://ntfy.sh/',{method:'POST',body:JSON.stringify({topic:S.s.ntfy,title:'Hábitos',message:'Notificación de prueba: todo funciona ✅'})})
    .then(r=>toast(r.ok?'Enviada. Revisa la app ntfy':'No se pudo enviar'))
    .catch(()=>toast('Sin conexión'));
}

/* refresco automático al cambiar de ventana horaria (12:00, 21:00, medianoche) */
let gate='';
function gateKey(){const h=nowH();return today()+(h>=12?'1':'0')+(h>=21?'1':'0')}
gate=gateKey();
setInterval(()=>{
  const g=gateKey();
  if(g!==gate){
    gate=g;
    const a=document.activeElement;
    if(!fm.open&&!(a&&/INPUT|TEXTAREA/.test(a.tagName)))render();
  }
},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!fm.open){gate=gateKey();render();try{nsync()}catch(e){}}});

render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
