name: Recordatorios de hábitos

# Horas en UTC. Lima es UTC-5 todo el año (sin horario de verano).
# GitHub puede retrasar los cron algunos minutos.
on:
  schedule:
    - cron: '0 12 * * *'    # 07:00 Lima - buenos días
    - cron: '0 20 * * *'    # 15:00 Lima - llenar hábitos y tareas
    - cron: '0 3 * * *'     # 22:00 Lima - buenas noches, regularizar y planificar mañana
  workflow_dispatch:

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar recordatorio por ntfy
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: ${{ vars.APP_URL }}
          CRON: ${{ github.event.schedule }}
        run: |
          case "$CRON" in
            "0 12 * * *") TITLE="Buenos días ☀️"; MSG="Que tengas un gran día. Marca tu gratitud antes de las 12:00 y revisa tu To-Do."; TAG="sunny";;
            "0 20 * * *") TITLE="Ponte al día"; MSG="Registra tus comidas, tu entrenamiento, tus lecturas y tus tareas del To-Do."; TAG="memo";;
            "0 3 * * *")  TITLE="Buenas noches 🌙"; MSG="Regulariza todo: registra tu pantalla y lo pendiente, y planifica tu día de mañana."; TAG="crescent_moon";;
            *)             TITLE="Prueba"; MSG="Los recordatorios de hábitos funcionan."; TAG="white_check_mark";;
          esac
          if [ -z "$TOPIC" ]; then echo "Falta el secreto NTFY_TOPIC"; exit 1; fi
          curl -sS -H "Content-Type: application/json" \
            -d "{\"topic\":\"$TOPIC\",\"title\":\"$TITLE\",\"message\":\"$MSG\",\"priority\":4,\"tags\":[\"$TAG\"],\"click\":\"$APP_URL\"}" \
            https://ntfy.sh/
